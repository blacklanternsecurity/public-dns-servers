name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: psf/black@stable
        with:
          # Pinned on purpose. This was previously unpinned, and the black 26.x
          # release changed a blank-line rule, which broke this job. Because the
          # nameserver refresh used to depend on it, the data pipeline stayed
          # dead from 2026-01 until 2026-07. Bump this deliberately.
          version: "26.5.1"
          options: "--check --diff"
      - name: Install Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install flake8
      - name: flake8
        run: |
          flake8 --select F,E722 --ignore F403,F405,F541
